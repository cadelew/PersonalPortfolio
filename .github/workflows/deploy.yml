name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        global-json-file: global.json

    - name: Restore dependencies
      run: dotnet restore

    - name: Build and publish
      run: dotnet publish -c Release -o dist/publish

    - name: Set GitHub Pages base href
      run: |
        if [ -f "dist/publish/wwwroot/index.html" ]; then
          sed -i 's|<base href="/" />|<base href="/PersonalPortfolio/" />|' dist/publish/wwwroot/index.html
        fi

    - name: Create Pages artifact
      run: |
        mkdir -p dist/site
        if [ -d "dist/publish/wwwroot" ]; then
          cp -r dist/publish/wwwroot/. dist/site/
        fi

    - name: Copy 404.html to root
      run: cp 404.html dist/site/404.html

    - name: Disable Jekyll processing
      run: touch dist/site/.nojekyll

    - name: List dist contents
      run: ls -la dist/site/

    - name: Upload artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: './dist/site'

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4
